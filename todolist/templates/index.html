<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern To-Do UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #111827, #1e1b4b);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      overflow-x: hidden;
      color: white;
    }

    .todo-container {
      width: 100%;
      max-width: 850px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 30px;
      padding: 35px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }

    .todo-container::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(59,130,246,0.15);
      border-radius: 50%;
      top: -120px;
      right: -120px;
      filter: blur(40px);
    }

    .header {
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
    }

    .header h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 22px;
      transition: 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,0.09);
    }

    .stat-card h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .stat-card p {
      color: rgba(255,255,255,0.65);
      font-size: 14px;
    }

    .input-section {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .input-section input {
      flex: 1;
      min-width: 250px;
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.3s ease;
    }

    .input-section input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(96,165,250,0.15);
      background: rgba(255,255,255,0.08);
    }

    .input-section input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .add-btn {
      padding: 18px 28px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 10px 25px rgba(59,130,246,0.3);
    }

    .add-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px rgba(139,92,246,0.35);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .task-list::-webkit-scrollbar {
      width: 8px;
    }

    .task-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
    }

    .task-item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s ease;
    }

    .task-item:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      border: 2px solid #60a5fa;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .custom-checkbox:hover {
      background: rgba(96,165,250,0.2);
    }

    .task-text {
      font-size: 16px;
      font-weight: 500;
    }

    .task-actions {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
      font-size: 15px;
    }

    .action-btn:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.6);
      border: 2px dashed rgba(255,255,255,0.1);
      border-radius: 24px;
      margin-top: 10px;
    }

    .empty-state i {
      font-size: 50px;
      margin-bottom: 15px;
      color: #8b5cf6;
    }

    .empty-state h3 {
      margin-bottom: 10px;
      font-size: 22px;
      color: white;
    }

    @media(max-width: 768px) {
      .todo-container {
        padding: 25px;
      }

      .header h1 {
        font-size: 32px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .task-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }

      .task-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

 <form action="" method="POST">
     <div class="todo-container">

    <div class="header">
      <h1>To-Do Dashboard</h1>
      <p>Organize your tasks with a modern premium interface.</p>
    </div>

    <div class="stats">
      <div class="stat-card">
         {{task | length}}
      
           <p>Total task</p>
      </div>

    </div>

    <div class="input-section" >
      <input type="text" placeholder="Add your next task..." name="task">
      <button class="add-btn" type="submit">
        <i class="fa-solid fa-plus"></i>
        Add Task
      </button>
    </div>
    </form>
    <div class="task-list">
      {% for i in task%}
      <form action="" method="POST">
      <div class="task-item">
        <div class="task-left">
          <div class="custom-checkbox"></div>
          <div class="task-text">
            {{i[0]}}
            <input type="hidden" name="del"     value="{{ i[0] }}"
 style="background-color: transparent;">
            <input
    type="text"
    name="update_task"
    class="update-input"
    style="display:none;"
>
            <button
    type="submit"
    name="edit_btn"
    class="save-btn"
    style="display:none;"
>
    Save
</button>
           
          </div>
        </div>

        <div class="task-actions">
          <button
    class="action-btn"
    type="button"
    onclick="showinput(this)"
>
    <i class="fa-solid fa-pen"></i>
</button>
          </button>

          <button class="action-btn-del" type="submit"  name="delete_btn">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
      </form>
       {% endfor %}
      </div>

    

    </div>

  </div>

</body>
<script>
function showinput(button) {

    let task =
    button.closest(".task-item");

    let inp =
    task.querySelector(".update-input");

    let saveBtn =
    task.querySelector(".save-btn");

    inp.style.display = "block";

    saveBtn.style.display = "block";
}
 </script>
</html>
